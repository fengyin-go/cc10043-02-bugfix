services:
  backend:
    build: ./backend
    ports:
      - "8017:8017"
    environment:
      - APP_ENV=local
  frontend:
    build: ./frontend
    ports:
      - "5197:5197"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8017
    depends_on:
      - backend
